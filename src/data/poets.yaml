# Her şair için bir kayıt. Anahtar (ör. "mevlana") şiir dosyalarında "poet:" alanında kullanılır.
mevlana:
  name: Mevlânâ Celâleddîn-i Rûmî
  fa: مولانا جلال‌الدین محمد بلخی
  years: 1207 – 1273
  place: Belh · Konya
  bio: Mesnevî ve Dîvân-ı Kebîr'in şairi. Hayatının büyük kısmını Konya'da geçirdi; eserleri Anadolu'da yüzyıllardır okunuyor.

sadi:
  name: Sa'dî-i Şîrâzî
  fa: سعدی شیرازی
  years: y. 1210 – 1291
  place: Şiraz
  bio: Gülistan ve Bostan'ın yazarı. Osmanlı medreselerinde Farsça bu iki kitapla öğretilirdi.

hafiz:
  name: Hâfız-ı Şîrâzî
  fa: حافظ شیرازی
  years: y. 1325 – 1390
  place: Şiraz
  bio: Gazelin ustası. Dîvân'ı Osmanlı döneminde Sûdî-i Bosnevî gibi şârihler tarafından satır satır şerh edildi.

aynulkudat:
  name: Aynülkudât-ı Hemedânî
  fa: عین‌القضات همدانی
  years: 1098 – 1131
  place: Hemedan
  bio: Temhîdât ve Nâmeler'in yazarı, Hemedanlı sûfî ve kadı. Fikirleri yüzünden genç yaşta Hemedan'da idam edildi.

gazali:
  name: İmam Gazâlî
  fa: امام محمد غزالی
  years: 1058 – 1111
  place: Tûs · Bağdat
  bio: İhyâü Ulûmi'd-dîn'in ve onun Farsça yeniden yazımı Kîmyâ-yı Saâdet'in yazarı. Bağdat Nizâmiye Medresesi'nde ders verdikten sonra tasavvuf yoluna yöneldi.

attar:
  name: Ferîdüddîn-i Attâr
  fa: عطار نیشابوری
  years: y. 1145 – 1221
  place: Nişabur
  bio: Mantıku't-Tayr, Esrârnâme, İlâhînâme ve Tezkiretü'l-Evliyâ'nın yazarı. Rivayete göre Esrârnâme'yi çocuk yaştaki Mevlânâ'ya hediye etmiştir.

suhreverdi:
  name: Şihâbüddîn-i Sühreverdî
  fa: شیخ شهاب‌الدین سهروردی
  years: 1154 – 1191
  place: Sühreverd · Halep
  bio: İşrâk felsefesinin kurucusu, Hikmetü'l-İşrâk'ın ve Fî Hakîkati'l-Aşk gibi Farsça risalelerin yazarı. Genç yaşta Halep'te idam edildiği için "Maktûl" lakabıyla da anılır.
